<f:layout name="Default"/>

<f:section name="content">

	<div class="faq" itemscope itemtype="https://schema.org/FAQPage">
		<ul>
			<f:for each="{questionsPerCategory}" as="element">
				<f:render partial="Faq/CategoryRec"
									arguments="{element: element}"/>
			</f:for>
		</ul>
	</div>

</f:section>
